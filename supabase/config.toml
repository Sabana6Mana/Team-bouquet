project_id = "team-bouquet"

[api]
enabled = true
port = 55321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 55322
shadow_port = 55320
major_version = 15

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[realtime]
enabled = true

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = [
  "http://127.0.0.1:5173/auth/callback",
  "http://localhost:5173/auth/callback",
  "com.teambouquet.matchpoint://auth/callback"
]
enable_signup = true
# Kept on locally because backend verifier scripts create isolated throwaway users.
# Disable anonymous sign-ins in the hosted competition project.
enable_anonymous_sign_ins = true

[auth.sms]
enable_signup = true
enable_confirmations = true

# Local SMS smoke test. No real text is sent for these reserved numbers.
# Never use these fixed OTPs or numbers in hosted/production configuration.
[auth.sms.test_otp]
821055500000 = "123456"
821055500001 = "654321"

# The local Auth image only enables phone login when an SMS provider is
# configured. These non-production placeholders are never contacted for the
# reserved test numbers above because GoTrue resolves their fixed OTP first.
[auth.sms.twilio]
enabled = true
account_sid = "AC00000000000000000000000000000000"
message_service_sid = "MG00000000000000000000000000000000"
auth_token = "local-test-only"

[auth.email]
enable_signup = true
enable_confirmations = false
double_confirm_changes = true

# Kakao OAuth reads credentials from the ignored project-root `.env` file.
# Never commit the Client Secret.
[auth.external.kakao]
enabled = true
client_id = "env(SUPABASE_AUTH_EXTERNAL_KAKAO_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_EXTERNAL_KAKAO_SECRET)"
redirect_uri = "http://localhost:55321/auth/v1/callback"
email_optional = true

[studio]
enabled = true
port = 55323
api_url = "http://127.0.0.1"
