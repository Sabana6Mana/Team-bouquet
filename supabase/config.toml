project_id = "team-bouquet"

[api]
enabled = true
port = 55321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 55322
shadow_port = 55320
major_version = 15

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[realtime]
enabled = true

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = [
  "http://127.0.0.1:5173/auth/callback",
  "http://localhost:5173/auth/callback"
]
enable_signup = true
enable_anonymous_sign_ins = true

[auth.email]
enable_signup = true
enable_confirmations = false
double_confirm_changes = true

# Kakao OAuth reads credentials from the ignored project-root `.env` file.
# Never commit the Client Secret.
[auth.external.kakao]
enabled = true
client_id = "env(SUPABASE_AUTH_EXTERNAL_KAKAO_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_EXTERNAL_KAKAO_SECRET)"
redirect_uri = "http://localhost:55321/auth/v1/callback"
email_optional = true

[studio]
enabled = true
port = 55323
api_url = "http://127.0.0.1"
